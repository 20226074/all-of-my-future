project:
  type: website
  output-dir: _site
  pre-render:
    - python scripts/build_graph.py
  render:
    - "*.qmd"
    - "topics/**/*.qmd"
    - "entries/**/*.qmd"
    - "references/**/*.qmd"
    - "log/**/*.qmd"
    - "!templates/**"
  resources:
    - "assets/generated/**"
    - "assets/js/**"

lang: ko
date-format: "YYYY-MM-DD"
bibliography: bibliography/references.bib

website:
  title: "All of My Future"
  description: "개념과 문헌의 관계를 탐색하는 개인 연구 지식 지도"
  site-url: "https://20226074.github.io/all-of-my-future/"
  page-navigation: true
  reader-mode: true
  back-to-top-navigation: true
  bread-crumbs: true
  search: false
  navbar:
    pinned: true
    collapse-below: lg
    right:
      - text: Queue
        href: queue.qmd
      - text: Log
        href: log/index.qmd
      - text: About
        href: about.qmd
  page-footer:
    border: true
    left: "A living research atlas · built with [Quarto](https://quarto.org/)"
    right:
      - text: "Home"
        href: index.qmd
      - text: "Working guide"
        href: about.qmd

format:
  html:
    theme:
      light: cosmo
      dark: darkly
    css: assets/styles.css
    toc: true
    toc-depth: 3
    anchor-sections: true
    smooth-scroll: true
    code-copy: true
    code-overflow: wrap
    citations-hover: true
    footnotes-hover: true
    link-external-newwindow: true
    include-after-body: assets/html/site-scripts.html

execute:
  freeze: auto
